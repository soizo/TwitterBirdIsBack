name: Build and release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for tests
        run: npx playwright install --with-deps chromium

      - name: Test and package both browsers
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npm test
          npm run package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          tag="build-${RUN_ID}-${RUN_ATTEMPT}"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Automated build of commit ${COMMIT}.

          Extension version: ${version}. Build: ${RUN_NUMBER}, attempt ${RUN_ATTEMPT}.
          Includes Chrome and unsigned Firefox ZIPs plus SHA256SUMS.
          Firefox ZIPs require Mozilla signing for permanent installation in standard Firefox.
          EOF
          gh release create "$tag" releases/*.zip releases/SHA256SUMS \
            --target "$COMMIT" \
            --title "v${version} · Build ${RUN_NUMBER}.${RUN_ATTEMPT}" \
            --notes-file "$notes"
