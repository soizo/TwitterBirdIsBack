<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitter Bird Is Back</title>
  <link rel="stylesheet" href="popup.css">
  <script src="settings.js" defer></script>
  <script src="locales.js" defer></script>
  <script src="popup-locales.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <img src="icons/icon-128.png" width="28" height="28" alt="" aria-hidden="true">
    <h1>Twitter Bird Is Back</h1>
  </header>
  <main>
    <form>
      <label class="option master" for="enabled"><input id="enabled" name="enabled" type="checkbox" disabled><span data-copy="enabled">Enable modifications</span></label>
      <fieldset>
        <legend data-copy="legend">Modifications</legend>
        <label class="option" for="bird"><input id="bird" name="bird" type="checkbox" disabled><span data-copy="bird">Blue bird &amp; site icon</span></label>
        <label class="option" for="terms"><input id="terms" name="terms" type="checkbox" disabled><span data-copy="terms">Classic wording</span></label>
        <label class="option" for="buttons"><input id="buttons" name="buttons" type="checkbox" disabled><span data-copy="buttons">Classic blue buttons</span></label>
        <label class="option" for="translation"><input id="translation" name="translation" type="checkbox" disabled><span data-copy="translation">Translation globe</span></label>
        <label class="option" for="title"><input id="title" name="title" type="checkbox" disabled><span data-copy="title">Tab titles</span></label>
        <label class="option" for="hideGrok"><input id="hideGrok" name="hideGrok" type="checkbox" disabled><span data-copy="hideGrok">Hide all Grok entry points</span></label>
        <label class="option" for="hideDrawers"><input id="hideDrawers" name="hideDrawers" type="checkbox" disabled><span data-copy="hideDrawers">Hide bottom-right Grok &amp; Chat</span></label>
      </fieldset>
    </form>
    <p class="scope" data-copy="scope">Wording and titles: 9 language options.</p>
  </main>
  <footer>
    <p role="status" aria-atomic="true" data-state="loading">Loading settings…</p>
    <p data-copy="hint">Applies to all Twitter tabs after you refresh them.</p>
  </footer>
</body>
</html>
